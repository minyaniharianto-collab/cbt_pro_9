.tmb{font-size:30px;font-weight:800;text-align:center;color:#1e3a8a}.mo{display:none}
@media(max-width:800px){.side{display:none}main{margin:0;padding:12px 12px 90px}
.bnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;padding:6px;justify-content:space-around;z-index:3}.bnav .nv{padding:6px;font-size:18px;text-align:center}
.ex{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:8px;gap:0;max-width:none}.ex>.g:first-child{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px!important}.qb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}.who{font-size:13px}.panel{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;transform:translateY(105%);transition:.25s;z-index:5;background:#fff!important;border-radius:18px 18px 0 0!important}.panel.open{transform:none}

<div id="cbt"><div id="root"></div><div id="modal"></div><div id="toast"></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
// ===== KONFIGURASI APLIKASI =====
if(!document.querySelector('meta[name=viewport]')){try{const m=document.createElement('meta');m.name='viewport';m.content='width=device-width, initial-scale=1';document.head.appendChild(m)}catch(e){}}
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY agar mode preview & data dummy hilang dan terhubung 100% ke Supabase
const SUPABASE_URL = "https://yxgepmxgwvcblrrhckus.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gAO8G4Hm634KtDlnZDoRag_gmGjOnfj";
const TEMPLATE_URL = "https://docs.google.com/document/d/1ZiWk-n4Kz8W2jOWDZAfcPFgsX0LICIzm/edit?usp=sharing&ouid=107856581458706219784&rtpof=true&sd=true"; // (opsional) link unduh Template_Soal_CBT.docx yang Anda unggah ke Google Drive/hosting
const sb = IS_PREVIEW ? null : createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== UTIL =====
const $=(s)=>document.querySelector(s),R=h=>$('#root').innerHTML=h,modal=h=>$('#modal').innerHTML=h?`<div class="ov"><div class="g mb">${h}</div></div>`:'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,t=3500)=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',t)};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const fmt=i=>i?new Date(i).toLocaleString('id-ID'):'-';
const lc=i=>i?new Date(new Date(i)-new Date(i).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
const TIPE={pg:'Pilihan Ganda',pgk:'PG Kompleks',bs:'Benar/Salah',isian:'Isian Singkat'};
const kk=q=>Array.isArray(q.kunci_soal)?q.kunci_soal[0]?.kunci:q.kunci_soal?.kunci;
const empty=n=>n?'':'<p style="text-align:center;color:#64748b;padding:20px">Belum ada data</p>';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== BRANDING (logo, nama ujian, nama sekolah) =====
const logo=(h=44)=>CFG.logo_url?`<img src="${esc(CFG.logo_url)}" alt="logo" style="height:${h}px;max-width:${h*3}px;object-fit:contain">`:'';
const brand=(h=56)=>`<div style="text-align:center;margin-bottom:10px">${logo(h)}<h2 style="margin:6px 0 0">${esc(CFG.nama_ujian||'CBT Pro')}</h2>${CFG.nama_sekolah?`<div style="color:#64748b;font-weight:600">${esc(CFG.nama_sekolah)}</div>`:''}</div>`;
const loadCfg=async()=>{try{CFG={...CFG,...await Q.cfg()}}catch(e){}};
const syncC=()=>{SETF.nama_ujian=$('#c_u').value;SETF.nama_sekolah=$('#c_s').value};
// ===== DATA DUMMY (hanya ada saat IS_PREVIEW = true) =====
const izinMin=(u,s)=>(u.ujian_izin.find(x=>x.jenis=='ruang'&&x.nama==s.ruang)||u.ujian_izin.find(x=>x.jenis=='kelas'&&x.nama==s.kelas)||{menit:u.izin_kirim_menit}).menit;
const M=IS_PREVIEW?{
 soal:[{id:'s1',tipe:'pg',mapel:'Matematika',teks:'2 + 2 = ?',gambar_url:'',opsi:[{k:'A',t:'3'},{k:'B',t:'4'},{k:'C',t:'5'},{k:'D',t:'6'}],bobot:1,kunci_soal:{kunci:'B'}}],
 ujian:[{id:'u1',judul:'Ujian Contoh',mapel:'Matematika',izin_kirim_menit:1,ujian_izin:[],durasi_menit:30,token_ujian:'ABC123',aktif:true,acak:true,tampilkan_nilai:true,mulai_at:null,selesai_at:null,ujian_soal:[{soal_id:'s1'}]}],
 siswa:[{id:'a1',username:'siswa1',nama:'Siswa Contoh',kelas:'X-1',ruang:'R1',password:'123',login_aktif:false}],
 guru:[{id:'g1',email:'guru@contoh.id',nama:'Guru Contoh',mapel:'Matematika'}],sesi_ujian:[],cfg:{nama_ujian:'Ujian Sekolah',nama_sekolah:'Sekolah Contoh',logo_url:''}}:null;
const pvSkor=(u,jw)=>{const bn=new Set((u.ujian_bonus||[]).map(b=>b.soal_id));let t=0,g=0;(u.ujian_soal||[]).forEach(x=>{const q=M.soal.find(y=>y.id==x.soal_id);if(!q)return;const k=q.kunci_soal.kunci,a=jw[q.id];t+=q.bobot;const ok=bn.has(q.id)||(a!=null&&(q.tipe=='pgk'?JSON.stringify([...a].sort())==JSON.stringify([...k].sort()):q.tipe=='isian'?k.some(z=>z.toLowerCase()==String(a).trim().toLowerCase()):a==k));if(ok)g+=q.bobot});return Math.round(g/(t||1)*10000)/100};
const PV=IS_PREVIEW?{
 siswa_login:({p_username,p_password})=>{const s=M.siswa.find(x=>x.username==p_username&&x.password==p_password);if(!s)throw Error('Username atau password salah');if(s.login_aktif)throw Error('SUDAH_LOGIN: Akun sedang aktif di perangkat lain. Minta guru melakukan Reset Login.');s.login_aktif=true;s.tok='T'+s.id;return{token:s.tok,nama:s.nama,kelas:s.kelas}},
 siswa_cek:({p_token})=>{const s=M.siswa.find(x=>x.tok==p_token);if(!s)throw Error('SESI_HABIS');return{nama:s.nama,kelas:s.kelas}},
 siswa_logout:({p_token})=>{const s=M.siswa.find(x=>x.tok==p_token);if(s){s.login_aktif=false;s.tok=null}},
 mulai_ujian:({p_token,p_kode})=>{const s=M.siswa.find(x=>x.tok==p_token),u=M.ujian.find(x=>x.token_ujian==p_kode.toUpperCase().trim());if(!s)throw Error('SESI_HABIS');if(!u)throw Error('Token ujian tidak valid');
  let ss=M.sesi_ujian.find(x=>x.ujian.id==u.id&&x.siswa.id==s.id);if(!ss){ss={id:uid(),started_at:new Date().toISOString(),seed:7,jawaban:{},ragu:[],pelanggaran:0,status:'mengerjakan',skor:null,last_sync:null,izin_kirim:false,siswa:s,ujian:u};M.sesi_ujian.unshift(ss)}
  if(ss.status=='selesai')throw Error('Anda sudah menyelesaikan ujian ini');
  return{server_now:Date.now(),nama:s.nama,ujian:{judul:u.judul,mapel:u.mapel,durasi:u.durasi_menit,acak:u.acak},sesi:{id:ss.id,started:new Date(ss.started_at).getTime(),seed:ss.seed,jawaban:ss.jawaban,ragu:ss.ragu,pel:ss.pelanggaran,izin_at:new Date(ss.started_at).getTime()+izinMin(u,s)*6e4,izin:ss.izin_kirim},
  soal:u.ujian_soal.map(x=>M.soal.find(y=>y.id==x.soal_id)).filter(Boolean).map(q=>({id:q.id,tipe:q.tipe,teks:q.teks,gambar:q.gambar_url,opsi:q.opsi}))}},
 simpan_jawaban:({p_sesi,p_jawaban,p_ragu,p_pel})=>{const ss=M.sesi_ujian.find(x=>x.id==p_sesi);if(ss.status!='mengerjakan')throw Error('SELESAI');Object.assign(ss,{jawaban:p_jawaban,ragu:p_ragu,pelanggaran:p_pel,last_sync:new Date().toISOString()});return{ok:true,izin:ss.izin_kirim,bonus:(ss.ujian.ujian_bonus||[]).map(b=>b.soal_id)}},
 submit_dan_hitung_nilai:({p_sesi,p_jawaban,p_ragu,p_pel})=>{const ss=M.sesi_ujian.find(x=>x.id==p_sesi);if(ss.status=='selesai')return{skor:ss.ujian.tampilkan_nilai?ss.skor:null,tampil:ss.ujian.tampilkan_nilai};
  const st=new Date(ss.started_at).getTime(),habis=Date.now()>=st+ss.ujian.durasi_menit*6e4;
  if(!habis&&!ss.izin_kirim){const bn=new Set((ss.ujian.ujian_bonus||[]).map(b=>b.soal_id));if(Date.now()<st+izinMin(ss.ujian,ss.siswa)*6e4)throw Error('BELUM_BOLEH: Pengiriman jawaban belum dibuka');if(p_ragu.filter(i=>!bn.has(i)).length)throw Error('MASIH_RAGU: Masih ada soal ragu-ragu');if(ss.ujian.ujian_soal.some(x=>p_jawaban[x.soal_id]==null&&!bn.has(x.soal_id)))throw Error('BELUM_LENGKAP: Masih ada soal belum dijawab')}
  Object.assign(ss,{jawaban:p_jawaban,ragu:p_ragu,pelanggaran:p_pel,status:'selesai',finished_at:new Date().toISOString(),skor:pvSkor(ss.ujian,p_jawaban)});return{skor:ss.ujian.tampilkan_nilai?ss.skor:null,tampil:ss.ujian.tampilkan_nilai}},
 admin_set_bonus:({p_ujian,p_soal})=>{const u=M.ujian.find(x=>x.id==p_ujian);u.ujian_bonus=u.ujian_soal.filter(x=>p_soal.includes(x.soal_id)).map(x=>({soal_id:x.soal_id}));let ch=0;M.sesi_ujian.forEach(ss=>{if(ss.ujian.id!=p_ujian||ss.status!='selesai')return;const n=pvSkor(u,ss.jawaban||{});if(n!==ss.skor){ss.skor=n;ch++}});return{bonus:u.ujian_bonus.length,berubah:ch}},
 sesi_status:({p_sesi})=>{const ss=M.sesi_ujian.find(x=>x.id==p_sesi);return ss?ss.status:'SELESAI'},
 admin_hentikan_ujian:({p_sesi,p_ujian,p_nonaktif})=>{if(p_ujian&&p_nonaktif)M.ujian.find(x=>x.id==p_ujian).aktif=false;let n=0;M.sesi_ujian.forEach(ss=>{if(ss.status!='mengerjakan')return;if(p_sesi?ss.id!=p_sesi:ss.ujian.id!=p_ujian)return;ss.izin_kirim=true;PV.submit_dan_hitung_nilai({p_sesi:ss.id,p_jawaban:ss.jawaban,p_ragu:[],p_pel:ss.pelanggaran});ss.dihentikan=true;n++});return n}
}:null;

// ===== LAPISAN DATA =====
const rpc=async(n,a)=>{if(IS_PREVIEW)return PV[n](a);const r=await sb.rpc(n,a);if(r.error)throw r.error;return r.data};
const T={
 async all(t,sel='*',ord='created_at',asc=false){if(IS_PREVIEW)return M[t].slice();const r=await sb.from(t).select(sel).order(ord,{ascending:asc});if(r.error)throw r.error;return r.data},
 async put(t,o){if(IS_PREVIEW){const i=M[t].findIndex(x=>x.id==o.id);i<0?M[t].unshift(o):M[t][i]={...M[t][i],...o};return o}const r=await sb.from(t).upsert(o).select().single();if(r.error)throw r.error;return r.data},
 async delWhere(t,col,v){if(IS_PREVIEW){M[t]=M[t].filter(x=>x[col]!=v);return}const r=await sb.from(t).delete().eq(col,v);if(r.error)throw r.error},
 async delIds(t,ids){if(IS_PREVIEW){const q=new Set(ids);M[t]=M[t].filter(x=>!q.has(x.id));return}for(let i=0;i<ids.length;i+=100){const r=await sb.from(t).delete().in('id',ids.slice(i,i+100));if(r.error)throw r.error}},
 async del(t,id){if(IS_PREVIEW){M[t]=M[t].filter(x=>x.id!=id);return}const r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error}};
const Q={
 async saveSoal(o,k){if(IS_PREVIEW)return T.put('soal',{...o,kunci_soal:{kunci:k}});await T.put('soal',o);await T.put('kunci_soal',{soal_id:o.id,kunci:k})},
 async saveUjian(o,ids,iz=[]){if(IS_PREVIEW)return T.put('ujian',{...o,ujian_soal:ids.map(soal_id=>({soal_id})),ujian_izin:iz,ujian_bonus:((M.ujian.find(x=>x.id==o.id)||{}).ujian_bonus||[]).filter(b=>ids.includes(b.soal_id))});try{await T.put('ujian',o)}catch(e){if(/kktp/i.test(e.message||'')){const{kktp,...r0}=o;await T.put('ujian',r0)}else throw e}
  for(const [tb,rows] of [['ujian_soal',ids.map(s=>({ujian_id:o.id,soal_id:s}))],['ujian_izin',iz.map(x=>({ujian_id:o.id,...x}))]]){let r=await sb.from(tb).delete().eq('ujian_id',o.id);if(r.error)throw r.error;if(rows.length){r=await sb.from(tb).insert(rows);if(r.error)throw r.error}}},
 async master(t,rows){if(IS_PREVIEW){const key=t=='siswa'?'username':'email';rows.forEach(x=>{const i=M[t].findIndex(y=>y[key]==x[key]);if(i<0)M[t].push({id:uid(),login_aktif:false,...x,password:x.password||x.username||x.email});else M[t][i]={...M[t][i],...x,password:x.password||M[t][i].password}});return}
  if(t=='siswa'){await rpc('admin_upsert_siswa',{p_rows:rows});return}
  await rpc('admin_upsert_guru',{p_rows:rows})},
 async resetMany(ids){if(IS_PREVIEW){ids.forEach(id=>{const s=M.siswa.find(x=>x.id==id);if(s){s.login_aktif=false;s.tok=null}});return}for(let i=0;i<ids.length;i+=100){const r=await sb.from('siswa').update({login_aktif:false,session_token:null}).in('id',ids.slice(i,i+100));if(r.error)throw r.error}},
 async reset(id){if(IS_PREVIEW){const s=M.siswa.find(x=>x.id==id);if(s){s.login_aktif=false;s.tok=null}return}const r=await sb.from('siswa').update({login_aktif:false,session_token:null}).eq('id',id);if(r.error)throw r.error}};
Object.assign(Q,{
 async cfg(){if(IS_PREVIEW)return {...M.cfg};return (await rpc('get_pengaturan',{}))||{}},
 async saveCfg(o){if(IS_PREVIEW){M.cfg={...o};return}const r=await sb.from('pengaturan').upsert({id:1,...o});if(r.error)throw r.error},
 async hasil(){if(IS_PREVIEW)return M.sesi_ujian.filter(x=>x.status=='selesai'&&(ROLE=='admin'||x.ujian.mapel==MAPEL));return await rpc('hasil_ujian_list',{})},
 async aktifPeserta(){const m={};if(IS_PREVIEW){M.sesi_ujian.filter(x=>x.status=='mengerjakan').forEach(x=>{const k=x.ujian.id;m[k]=(m[k]||0)+1});return m}const r=await sb.from('sesi_ujian').select('ujian_id').eq('status','mengerjakan');if(r.error)throw r.error;(r.data||[]).forEach(x=>{m[x.ujian_id]=(m[x.ujian_id]||0)+1});return m},
 async setBonus(uj,ids){return await rpc('admin_set_bonus',{p_ujian:uj,p_soal:ids})},
 async hentikan(sesi,ujian,nonaktif){return await rpc('admin_hentikan_ujian',{p_sesi:sesi||null,p_ujian:ujian||null,p_nonaktif:!!nonaktif})},
 async izin(id){if(IS_PREVIEW){M.sesi_ujian.find(x=>x.id==id).izin_kirim=true;return}const r=await sb.from('sesi_ujian').update({izin_kirim:true}).eq('id',id);if(r.error)throw r.error},
 async kel(ids,f,v){if(IS_PREVIEW){M.siswa.forEach(x=>{if(ids.includes(x.id))x[f]=v});return}const r=await sb.from('siswa').update({[f]:v}).in('id',ids);if(r.error)throw r.error},
 async delGuru(id){if(IS_PREVIEW){M.guru=M.guru.filter(x=>x.id!=id);return}await rpc('admin_hapus_guru',{p_id:id})}});
const Adm={
 async login(e,p){if(IS_PREVIEW)return;const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error},
 async has(){if(IS_PREVIEW)return false;const r=await sb.auth.getSession();return !!r.data.session},
 async me(){if(IS_PREVIEW)return null;const u=(await sb.auth.getUser()).data.user;if(!u)return null;const r=await sb.from('profil').select('role,nama,mapel').eq('id',u.id).maybeSingle();return r.data},
 async out(){if(!IS_PREVIEW)await sb.auth.signOut()}};

 <div class="panel g" id="pn"><div style="padding:14px"><div class="tmb" id="tm">--:--:--</div><div class="qn">${X.L.map((x,j)=>`<div class="n ${X.ans[x.id]!=null?'a':''} ${X.ragu.has(x.id)?'r':''} ${j==X.i?'c':''}" data-a="goto" data-i="${j}">${j+1}</div>`).join('')}</div>
 <small>🟦 dijawab &nbsp; 🟨 ragu-ragu</small><p><button class="bd" id="fin" style="width:100%" data-a="finish">Kirim Jawaban</button></p><small id="fi"></small></div></div></div>`);tick()}
async function finish(auto){if(EX.sub)return;EX.sub=true;try{const r=await rpc('submit_dan_hitung_nilai',{p_token:TOK,p_sesi:EX.sid,p_jawaban:EX.ans,p_ragu:[...EX.ragu],p_pel:EX.pel});
  clearInterval(EX.iv);clearTimeout(EX.sv);['cbt_cur','cbt_pkg','cbt_st_'+EX.sid].forEach(k=>localStorage.removeItem(k));EX=null;if(document.fullscreenElement)document.exitFullscreen();
  R(`<div class="lg"><div class="g" style="padding:28px;text-align:center;width:min(420px,100%)">${logo(48)}<h2>✅ Ujian Selesai</h2>${r.tampil?`<p>Nilai Anda</p><h1 style="font-size:54px;margin:0">${r.skor}</h1>`:'<p>Jawaban Anda telah tersimpan. Nilai akan diumumkan oleh guru.</p>'}<button data-a="logoutS">Keluar</button></div></div>`)}
 catch(e){toast('Gagal mengirim: '+(e.message||'periksa koneksi')+'. Mencoba lagi...');setTimeout(()=>{if(EX)EX.sub=false},5000)}}
function viol(m){if(!EX)return;EX.pel++;persist();toast('⚠ '+m+' (pelanggaran: '+EX.pel+')',5000)}
document.addEventListener('visibilitychange',()=>{if(EX&&document.hidden)viol('Anda berpindah tab/aplikasi!')});
document.addEventListener('fullscreenchange',()=>{if(EX&&!document.fullscreenElement)viol('Keluar dari layar penuh terdeteksi!')});
window.addEventListener('online',()=>flush());

// ===== PWA (manifest Data URI + Service Worker via Blob) =====
function pwa(){try{const l=document.createElement('link');l.rel='manifest';l.href='data:application/json,'+encodeURIComponent(JSON.stringify({name:'CBT Pro',short_name:'CBT',start_url:'.',display:'standalone',background_color:'#ffffff',theme_color:'#2563eb'}));document.head.appendChild(l);
 if('serviceWorker' in navigator)navigator.serviceWorker.register(URL.createObjectURL(new Blob(["self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',()=>{});"],{type:'text/javascript'}))).catch(()=>{})}catch(e){}}

// ===== BOOT =====
(async()=>{pwa();await loadCfg();
 try{if(await Adm.has()){const p=await Adm.me();if(p)return enter(p);await Adm.out()}}catch(e){}
 const t=localStorage.getItem('cbt_tok');if(!t)return loginView();TOK=t;
 try{const r=await rpc('siswa_cek',{p_token:t}),k=localStorage.getItem('cbt_cur');k?await loadExam(k):tokenView(r.nama)}
 catch(e){const c=localStorage.getItem('cbt_pkg');if(c&&localStorage.getItem('cbt_cur')&&!/SESI_HABIS/.test(e.message)){toast('Offline: melanjutkan dari data tersimpan');startExam(JSON.parse(c))}else{['cbt_tok','cbt_cur','cbt_pkg'].forEach(k=>localStorage.removeItem(k));TOK=null;loginView()}}
})();
</script>
